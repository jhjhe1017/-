
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>나만의 용돈 관리 프로그램</title>
<style>
body {
  font-family: Arial, sans-serif;
  background: #f0f5f1;
  margin: 0;
  padding: 30px 15px;
  color: #263d32;
}
.container {
  max-width: 650px;
  margin: auto;
  background: white;
  padding: 28px;
  border-radius: 18px;
  box-shadow: 0 5px 20px #0001;
}
h1 { color: #246348; text-align: center; }
.summary {
  background: #214c40;
  color: white;
  padding: 22px;
  border-radius: 12px;
  text-align: center;
}
.summary h2 { font-size: 30px; }
input, select, button {
  box-sizing: border-box;
  width: 100%;
  padding: 12px;
  margin: 7px 0;
  border: 1px solid #ccd8d0;
  border-radius: 8px;
  font-size: 15px;
}
button {
  background: #287b58;
  color: white;
  border: none;
  cursor: pointer;
}
button:hover { background: #195b40; }
.delete { background: #c75050; width: auto; }
.edit { background: #6487a9; width: auto; }
.item {
  display: flex;
  justify-content: space-between;
  align-items: center;
  border-bottom: 1px solid #eee;
  padding: 12px 0;
  gap: 10px;
}
.item button { padding: 8px; }
.bar {
  background: #e3ebe5;
  height: 12px;
  border-radius: 10px;
  overflow: hidden;
}
#progress {
  height: 12px;
  background: #39966b;
  width: 0%;
}
h3 { margin-top: 28px; }
</style>
</head>
<body>
<div class="container">
  <h1>💰 나만의 용돈 관리</h1>

  <div class="summary">
    <p>남은 용돈</p>
    <h2 id="balance">0원</h2>
    <p id="summary">총 용돈 0원 | 총 지출 0원</p>
  </div>

  <h3>📊 소비 현황</h3>
  <div class="bar"><div id="progress"></div></div>
  <p id="status">용돈을 설정해 주세요.</p>

  <h3>💵 용돈 설정</h3>
  <input type="number" id="budget" placeholder="이번 달 용돈 입력">
  <button onclick="setBudget()">용돈 설정하기</button>

  <h3>🛒 지출 등록</h3>
  <input id="name" placeholder="무엇에 돈을 사용했나요?">
  <input type="number" id="amount" placeholder="지출 금액">
  <select id="category">
    <option>식비</option>
    <option>교통</option>
    <option>쇼핑</option>
    <option>문화생활</option>
    <option>학용품</option>
    <option>기타</option>
  </select>
  <button onclick="addExpense()">지출 등록하기</button>

  <h3>📋 지출 내역</h3>
  <div id="list"></div>

  <h3>📈 지출 통계</h3>
  <div id="stats"></div>
</div>

<script>
let budget = Number(localStorage.getItem("budget")) || 0;
let expenses = JSON.parse(localStorage.getItem("expenses") || "[]");
let editId = null;

function save() {
  localStorage.setItem("budget", budget);
  localStorage.setItem("expenses", JSON.stringify(expenses));
  render();
}

function setBudget() {
  const value = Number(document.getElementById("budget").value);
  if (!Number.isSafeInteger(value) || value <= 0) {
    alert("0보다 큰 금액을 입력하세요.");
    return;
  }
  const spent = expenses.reduce((s, e) => s + e.amount, 0);
  if (value < spent) {
    alert("이미 지출한 금액보다 큰 예산을 입력하세요.");
    return;
  }
  budget = value;
  save();
  alert("용돈이 설정되었습니다!");
}

function addExpense() {
  const name = document.getElementById("name").value.trim();
  const amount = Number(document.getElementById("amount").value);
  const category = document.getElementById("category").value;

  if (!name || !Number.isSafeInteger(amount) || amount <= 0) {
    alert("사용 내역과 올바른 금액을 입력하세요.");
    return;
  }

  const spent = expenses.reduce((s, e) => s + e.amount, 0);
  const oldAmount = editId === null ? 0 :
    expenses.find(e => e.id === editId).amount;

  if (budget <= 0 || spent - oldAmount + amount > budget) {
    alert("용돈을 먼저 설정하거나 예산을 확인하세요.");
    return;
  }

  if (editId !== null) {
    expenses = expenses.map(e => e.id === editId
      ? {...e, name, amount, category} : e);
    editId = null;
  } else {
    expenses.push({
      id: Date.now(),
      name, amount, category,
      date: new Date().toLocaleDateString("ko-KR")
    });
  }

  document.getElementById("name").value = "";
  document.getElementById("amount").value = "";
  save();
}

function removeExpense(id) {
  if (!confirm("이 지출 내역을 삭제할까요?")) return;
  expenses = expenses.filter(e => e.id !== id);
  save();
}

function editExpense(id) {
  const e = expenses.find(e => e.id === id);
  document.getElementById("name").value = e.name;
  document.getElementById("amount").value = e.amount;
  document.getElementById("category").value = e.category;
  editId = id;
  window.scrollTo({top: 0, behavior: "smooth"});
}

function render() {
  const spent = expenses.reduce((s, e) => s + e.amount, 0);
  const balance = budget - spent;
  const percent = budget ? spent / budget * 100 : 0;

  document.getElementById("balance").textContent =
    balance.toLocaleString() + "원";

  document.getElementById("summary").textContent =
    `총 용돈 ${budget.toLocaleString()}원 | 총 지출 ${spent.toLocaleString()}원`;

  document.getElementById("progress").style.width =
    Math.min(100, percent) + "%";

  document.getElementById("status").textContent =
    budget === 0 ? "먼저 용돈을 설정하세요." :
    balance === 0 ? "용돈을 모두 사용했습니다!" :
    balance < 10000 ? "용돈이 얼마 남지 않았습니다!" :
    balance < 50000 ? "계획적으로 사용하세요." :
    "아직 용돈이 충분합니다!";

  document.getElementById("list").innerHTML =
    expenses.map(e => `
      <div class="item">
        <div>
          <b>${escapeHTML(e.name)}</b><br>
          <small>${escapeHTML(e.category)} · ${e.date || ""}</small><br>
          ${e.amount.toLocaleString()}원
        </div>
        <div>
          <button class="edit" onclick="editExpense(${e.id})">수정</button>
          <button class="delete" onclick="removeExpense(${e.id})">삭제</button>
        </div>
      </div>
    `).join("") || "<p>아직 지출 내역이 없습니다.</p>";

  const categories = ["식비","교통","쇼핑","문화생활","학용품","기타"];
  document.getElementById("stats").innerHTML =
    categories.map(c => {
      const sum = expenses.filter(e => e.category === c)
        .reduce((s,e) => s + e.amount, 0);
      return `<p>${c}: ${sum.toLocaleString()}원</p>`;
    }).join("");
}

function escapeHTML(value) {
  return String(value).replace(/[&<>"']/g, c => ({
    "&":"&amp;", "<":"&lt;", ">":"&gt;",
    '"':"&quot;", "'":"&#39;"
  })[c]);
}

render();
</script>
</body>
</html>
